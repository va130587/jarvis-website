<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Jarvis: a personal chief of staff that tracks commitments, promotion evidence and the path to a CTO or CEO role.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<script>try{var t=localStorage.getItem('jarvis.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true">J</span>
      <div><b>Jarvis</b><small>Personal chief of staff</small></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#today" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Today</span></a>
      <a href="#commitments" data-view="commitments"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span>Commitments</span></a>
      <a href="#promotion" data-view="promotion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4v-6H4zM10 20h4V9h-4zM16 20h4V4h-4z"/></svg><span>Promotion</span></a>
      <a href="#radar" data-view="radar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg><span>Career radar</span></a>
      <a href="#review" data-view="review"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Weekly review</span></a>
      <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/></svg><span>Approvals</span><em class="badge" id="inboxBadge" hidden></em></a>
      <a href="#profile" data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>My profile</span></a>
      <a href="blueprint/" class="ext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6M8 14h8M8 17h5"/></svg><span>Blueprint</span></a>
    </nav>
    <div class="side-tools">
      <button type="button" class="tool" id="themeBtn">Theme: System</button>
      <button type="button" class="tool" id="exportBtn">Export backup</button>
      <button type="button" class="tool" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="dlgForm" method="dialog">
    <h2 id="dlgTitle">Edit</h2>
    <div id="dlgHint" class="dlg-hint" hidden></div>
    <div id="dlgFields" class="fields"></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="dlgCancel">Cancel</button>
      <button type="submit" class="btn primary" id="dlgSave">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
