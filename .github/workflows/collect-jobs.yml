# Collects fresher-friendly UAE jobs from official public job boards every 6 hours and saves them in data/jobs.json.
# Free for public repositories. No keys needed. Optional phone alerts use ntfy.sh (see the README).
name: Collect jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect jobs
        env:
          # Optional. Put the topic in Settings > Secrets and variables > Actions. It is never written to a file or printed.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          ALERT_TITLES: ${{ vars.ALERT_TITLES }}
          ALERT_SKILLS: ${{ vars.ALERT_SKILLS }}
          ALERT_CITIES: ${{ vars.ALERT_CITIES }}
          ALERT_MIN_SCORE: ${{ vars.ALERT_MIN_SCORE }}
          ALERT_VISA: ${{ vars.ALERT_VISA }}
          ALERT_YEARS: ${{ vars.ALERT_YEARS }}
          ALERT_NATIONALITY: ${{ vars.ALERT_NATIONALITY }}
          SITE_URL: https://va130587.github.io/jarvis-website/
        run: node scripts/collect-jobs.js

      - name: Check the learning links (at most once a week)
        run: node scripts/check-links.js

      - name: Save the results
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/jobs.json data/SOURCES.md data/links-status.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update jobs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
